<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" viewBox="0 0 100 40" role="img" aria-label="Resume"><title>Resume</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .35s ease-out both}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}.blink{animation:blink 1.1s step-end infinite}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}@keyframes blink{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="98.8" height="39" rx="10" fill="#161b22" stroke="#30363d"/><g transform="translate(14.0,11.0) scale(0.7500)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></g><text x="40" y="25" class="m" font-size="12.5" font-weight="500" fill="#e6edf3">Resume</text></svg>
