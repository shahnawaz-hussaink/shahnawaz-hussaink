<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-label="Open to backend roles and collaborations. Email is fastest."><title>Open to backend roles and collaborations. Email is fastest.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .35s ease-out both}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}.blink{animation:blink 1.1s step-end infinite}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}@keyframes blink{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="c"><rect x=".5" y=".5" width="839" height="167" rx="16"/></clipPath><radialGradient id="g" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#3fb950" stop-opacity="0.22"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="839" height="167" rx="16" fill="#161b22" stroke="#30363d"/><rect clip-path="url(#c)" width="840" height="168" fill="url(#g)"/><g class="up"><text x="36" y="46" class="m" font-size="12.5" fill="#8b949e"><tspan fill="#d29922" font-weight="700">POST</tspan> /v1/hire  →  <tspan fill="#3fb950" font-weight="700">201 Created</tspan></text><text x="35" y="90" font-size="27" font-weight="700" letter-spacing="-.4" fill="#e6edf3">Open to backend roles and collaborations.</text><text x="36" y="120" font-size="15" fill="#8b949e">Especially where the hard problems are about scale and reliability.</text><text x="36" y="144" font-size="15" fill="#8b949e">Email is fastest. My inbox has no rate limit.</text></g></svg>
