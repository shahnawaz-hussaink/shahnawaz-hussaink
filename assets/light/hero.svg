<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Shahnawaz Hussain, backend developer in Delhi, open to opportunities"><title>Shahnawaz Hussain, backend developer in Delhi, open to opportunities</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .35s ease-out both}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}.blink{animation:blink 1.1s step-end infinite}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}@keyframes blink{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.ph{opacity:0}.ph0{opacity:1}@keyframes ph0{0.00%{opacity:0;transform:translateY(6px)}2.50%{opacity:1;transform:none}17.50%{opacity:1;transform:none}20.00%{opacity:0;transform:translateY(-6px)}}.ph0{animation:ph0 16.0s linear infinite}@keyframes ph1{0%{opacity:0}20.00%{opacity:0;transform:translateY(6px)}22.50%{opacity:1;transform:none}37.50%{opacity:1;transform:none}40.00%{opacity:0;transform:translateY(-6px)}}.ph1{animation:ph1 16.0s linear infinite}@keyframes ph2{0%{opacity:0}40.00%{opacity:0;transform:translateY(6px)}42.50%{opacity:1;transform:none}57.50%{opacity:1;transform:none}60.00%{opacity:0;transform:translateY(-6px)}}.ph2{animation:ph2 16.0s linear infinite}@keyframes ph3{0%{opacity:0}60.00%{opacity:0;transform:translateY(6px)}62.50%{opacity:1;transform:none}77.50%{opacity:1;transform:none}80.00%{opacity:0;transform:translateY(-6px)}}.ph3{animation:ph3 16.0s linear infinite}@keyframes ph4{0%{opacity:0}80.00%{opacity:0;transform:translateY(6px)}82.50%{opacity:1;transform:none}97.50%{opacity:1;transform:none}100.00%{opacity:0;transform:translateY(-6px)}}.ph4{animation:ph4 16.0s linear infinite}.scan{transform:translateX(-160px);animation:scan 7s ease-in-out 1s infinite}@keyframes scan{0%{transform:translateX(-160px)}60%,100%{transform:translateX(860px)}}</style><defs><clipPath id="c"><rect x=".5" y=".5" width="839" height="299" rx="16"/></clipPath><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d0d7de"/></pattern><radialGradient id="g1" cx="88%" cy="0%" r="65%"><stop offset="0" stop-color="#1a7f37" stop-opacity="0.12"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="0%" cy="100%" r="55%"><stop offset="0" stop-color="#0969da" stop-opacity="0.072"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#1a7f37" stop-opacity="0"/><stop offset=".5" stop-color="#1a7f37"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="299" rx="16" fill="#f6f8fa" stroke="#d0d7de"/><g clip-path="url(#c)"><rect width="840" height="300" fill="url(#d)" opacity="0.8"/><rect width="840" height="300" fill="url(#g1)"/><rect width="840" height="300" fill="url(#g2)"/><rect class="scan" y="0" width="160" height="2" fill="url(#s)"/></g><g class="up"><rect x="40.0" y="32.0" width="77.9" height="24" rx="12.0" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-opacity=".45"/><circle cx="53" cy="44" r="4" fill="#1a7f37" class="pulse"/><circle cx="53" cy="44" r="4" fill="#1a7f37"/><text x="64" y="48.5" class="m" font-size="12" font-weight="700" fill="#1a7f37">200 OK</text><text x="129.9" y="48.5" class="m" font-size="13" fill="#59636e">GET api.shahcodes.dev/v1/whoami</text><text x="800" y="48.5" text-anchor="end" class="m" font-size="12.5" fill="#59636e">Delhi, India · UTC+5:30</text></g><text x="38" y="120" font-size="48" font-weight="800" letter-spacing="-1.2" fill="#1f2328" class="up" style="animation-delay:0.10s">Shahnawaz Hussain</text><text x="40" y="158" font-size="18" fill="#59636e" class="up" style="animation-delay:0.22s">Backend developer. I build the parts of a product you never see:</text><text x="40" y="184" font-size="18" fill="#59636e" class="up" style="animation-delay:0.28s">APIs, job queues, locks and caches, and what happens to them under load.</text><g class="up" style="animation-delay:0.40s"><text x="40" y="232" class="m" font-size="14" fill="#59636e"><tspan fill="#1a7f37">$</tspan> currently building:</text><g class="ph ph0"><text x="227.9" y="232" class="m" font-size="14" fill="#1f2328">real-time data-ingestion APIs @ CyPSi Lab, DU</text><rect x="615.2" y="219" width="8" height="17" fill="#1a7f37" class="blink"/></g><g class="ph ph1"><text x="227.9" y="232" class="m" font-size="14" fill="#1f2328">row-level locking in PostgreSQL</text><rect x="495.6" y="219" width="8" height="17" fill="#1a7f37" class="blink"/></g><g class="ph ph2"><text x="227.9" y="232" class="m" font-size="14" fill="#1f2328">BullMQ job queues and workers</text><rect x="478.5" y="219" width="8" height="17" fill="#1a7f37" class="blink"/></g><g class="ph ph3"><text x="227.9" y="232" class="m" font-size="14" fill="#1f2328">Redis caching and rate limiting</text><rect x="495.6" y="219" width="8" height="17" fill="#1a7f37" class="blink"/></g><g class="ph ph4"><text x="227.9" y="232" class="m" font-size="14" fill="#1f2328">Go concurrency patterns</text><rect x="427.3" y="219" width="8" height="17" fill="#1a7f37" class="blink"/></g></g><g class="up" style="animation-delay:0.55s"><rect x="40.0" y="252.0" width="195.7" height="30" rx="15.0" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-opacity=".45"/><circle cx="56" cy="267" r="4" fill="#1a7f37" class="pulse"/><circle cx="56" cy="267" r="4" fill="#1a7f37"/><text x="68.0" y="271.5" class="m" font-size="12" fill="#1a7f37">open to opportunities</text></g><g class="up" style="animation-delay:0.63s"><rect x="245.7" y="252" width="211.0" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text x="259.7" y="271.5" class="m" font-size="12" fill="#1f2328">Developer @ SamarthX eGov</text></g><g class="up" style="animation-delay:0.71s"><rect x="466.7" y="252" width="306.2" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text x="480.7" y="271.5" class="m" font-size="12" fill="#1f2328">CS @ ARSD College, University of Delhi</text></g></svg>
